name: "PR Verify"
on:
    pull_request: 
        branches: [ "main" ]
    push:
        branches: [ "main" ]
    
jobs:
    build:
        name: PR Verify
        runs-on: ubuntu-latest
        steps:

        -   name: Checkout code
            uses: actions/checkout@v4

        -   name: Setup .NET
            uses: actions/setup-dotnet@v4
            # with:
            #     dotnet-version: 8.x
            #     dotnet-quality: 'ga'

        -   name: Restore dependencies
            run: dotnet restore

        -   name: Build
            run: dotnet build --no-restore

        -   name: "Run unit tests"
            run: dotnet test tests/Stayza.Tests.Unit/Stayza.Tests.Unit.csproj --configuration Release --verbosity normal --logger trx --collect:"XPlat Code Coverage"