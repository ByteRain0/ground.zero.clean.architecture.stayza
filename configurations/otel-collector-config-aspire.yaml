#https://opentelemetry.io/docs/collector/configuration -> for more information
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
  filter/healthcheck:
    error_mode: ignore
    traces:
      span:
        - 'attributes["http.route"] == "/healthcheck"'
  attributes/environment:
    actions:
      - key: environment
        value: development
        action: upsert
      # Example of how to delete specific data so no PII is breached
      - key: sureName
        action: delete

exporters:
  debug:
    verbosity: detailed
  otlp:
    endpoint: "aspire-dashboard:18889"
    tls:
      insecure: true

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp, debug]
    traces:
      receivers: [otlp]
      processors: [batch, filter/healthcheck, attributes/environment]
      exporters: [otlp, debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp, debug]